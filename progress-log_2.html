  /* ---------- Due card ---------- */

  .del-btn{
    width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--paper);

  }
  .range-toggle button.active{background:var(--primary);border-color:var(--primary);color:var(--paper);}
  .chart-legend{display:flex;gap:14px;margin-top:6px;flex-wrap:wrap;}
  .legend-item{display:flex;align-items:center;gap:5px;font-size:.72rem;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;}
  .legend-swatch{width:14px;height:3px;border-radius:2px;}
  .chip-mini{
    display:inline-flex;flex-direction:column;gap:1px;background:var(--paper);border:1px solid var(--line);
    border-radius:10px;padding:7px 10px;margin:0 6px 6px 0;
  }
  .chip-mini .d1{font-family:'IBM Plex Mono',monospace;font-size:.68rem;color:var(--ink-soft);}

  /* ---------- Tabbar ---------- */
  .tabbar{

  /* ---------- Modal ---------- */
  .modal-overlay{

    background:var(--paper);width:100%;max-width:460px;border-radius:20px 20px 0 0;

  .modal-sheet h2{font-size:1.2rem;margin-bottom:4px;}

  .unit-toggle{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;}
  .unit-toggle button{flex:1;padding:9px;border:none;background:var(--paper);color:var(--ink-soft);cursor:pointer;font-weight:600;}

  /* ---------- Onboarding ---------- */
  #onboard{padding:26px 22px;min-height:100vh;display:flex;flex-direction:column;justify-content:center;}
  #onboard h1{font-size:1.7rem;color:var(--primary-deep);margin-bottom:6px;}

  /* ---------- Lock screen ---------- */
  #lockScreen{
    min-height:100vh;display:flex;flex-direction:column;justify-content:center;

  }
  .lock-icon-wrap{
    width:58px;height:58px;border-radius:50%;background:rgba(248,249,251,0.12);
    display:flex;align-items:center;justify-content:center;margin:0 auto 16px;
  }
  .lock-icon-wrap svg{width:26px;height:26px;color:var(--primary-light);}
  #lockScreen h1{color:var(--paper);font-size:1.4rem;margin-bottom:6px;}
  #lockScreen p.lead{color:rgba(248,249,251,0.75);font-size:.85rem;margin-bottom:22px;}
  #lockScreen input{
    text-align:center;letter-spacing:3px;font-size:1.15rem;padding:14px;border-radius:12px;
    border:none;margin-bottom:12px;width:100%;background:var(--paper);color:var(--ink);
  }
  #lockScreen .err-msg{color:#F3C6C2;margin-bottom:10px;}
  #lockScreen .reset-link{
    margin-top:20px;background:none;border:none;color:rgba(248,249,251,0.65);
    font-size:.78rem;text-decoration:underline;cursor:pointer;
  }

  .storage-warn{
    background:var(--alert);color:#fff;padding:10px 16px;font-size:.76rem;text-align:center;
    line-height:1.4;
  }

  .toast{
    position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;
    font-size:.82rem;z-index:80;opacity:0;pointer-events:none;transition:opacity .3s ease;
  }
  .toast.show{opacity:1;}

  .loading-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;color:var(--ink-soft);gap:10px;}
  .loading-wrap svg{width:30px;height:30px;color:var(--primary);animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>

<div id="app-shell">
  <div id="root"></div>
</div>
<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  /* ============== ICONS ============== */
  const ICONS = {
    target: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.2"/><circle cx="12" cy="12" r="4.4"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/></svg>`,
    plusCircle: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>`,
    list: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3.5h6v2H9z"/><line x1="8" y1="10.5" x2="16" y2="10.5"/><line x1="8" y1="14.5" x2="16" y2="14.5"/><line x1="8" y1="18.5" x2="12" y2="18.5"/></svg>`,
    scale: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16a8 8 0 0 1 16 0"/><line x1="12" y1="16" x2="15.2" y2="10.8"/><line x1="3" y1="16" x2="21" y2="16"/></svg>`,
    syringe: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="21" y1="3" x2="18" y2="6"/><line x1="19.5" y1="7.5" x2="17" y2="5"/><path d="M16 6 8 14"/><path d="M8 14l-4.5 4.5"/><path d="M13 9l2 2"/><path d="M11 11l2 2"/><path d="M15 5l4 4-2.5 2.5-4-4Z"/></svg>`,
    trend: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="4,17 10,11 14,15 20,6"/><polyline points="14,6 20,6 20,12"/></svg>`,
    gear: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a7.9 7.9 0 0 0 0-6l2-1.7-2-3.4-2.5 1a8 8 0 0 0-2.1-1.2L14.4 1h-4l-.4 2.7a8 8 0 0 0-2.1 1.2l-2.5-1-2 3.4L5.4 9a7.9 7.9 0 0 0 0 6l-2 1.7 2 3.4 2.5-1a8 8 0 0 0 2.1 1.2l.4 2.7h4l.4-2.7a8 8 0 0 0 2.1-1.2l2.5 1 2-3.4Z"/></svg>`,
    lock: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>`,
    spinner: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 2a10 10 0 0 1 10 10"/></svg>`
  };

  /* ============== STATE ============== */
  let settings = null;
  let weightEntries = [];
  let injections = [];
  let authHash = null;
  let storageOK = true;
  let activeTab = 'home';
  let editingWeightId = null;
  let editingShotId = null;
  let checkinPrefillShot = false;
  let trendsRange = 90;
  let chartRef = null;
  let barChartRef = null;

  const $root = document.getElementById('root');
  const $modalRoot = document.getElementById('modalRoot');
  const $toast = document.getElementById('toast');

  /* ============== STORAGE (localStorage, on-device only) ============== */
  const LS_PREFIX = 'pl_';
  function lsGet(key){
    try{
      const v = localStorage.getItem(LS_PREFIX+key);
      return v ? JSON.parse(v) : null;
    }catch(e){ return null; }
  }
  function lsSet(key, val){
    try{
      localStorage.setItem(LS_PREFIX+key, JSON.stringify(val));
      return true;
    }catch(e){
      showToast("Couldn't save — storage may be full");
      return false;
    }
  }
  function lsRemove(key){
    try{ localStorage.removeItem(LS_PREFIX+key); }catch(e){}
  }
  async function storGet(key){ return lsGet(key); }
  async function storSet(key, val){ return lsSet(key, val); }
  function testStorage(){
    try{
      const testKey = LS_PREFIX+'__test__';
      localStorage.setItem(testKey, '1');
      const ok = localStorage.getItem(testKey) === '1';
      localStorage.removeItem(testKey);
      return ok;
    }catch(e){ return false; }
  }
  function warningBanner(){
    return storageOK ? '' : `<div class="storage-warn">This page can't save anything right now — including your passcode and entries. Open it directly in Safari (not a preview) for saving to work.</div>`;
  }

  function showToast(msg){
    $toast.textContent = msg;
    $toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=> $toast.classList.remove('show'), 2400);
  }

  /* ============== PASSWORD ============== */
  async function hashPassword(pw){
    const payload = 'pl-salt-v1-'+pw;
    try{
      if(window.crypto && window.crypto.subtle){
        const enc = new TextEncoder().encode(payload);
        const buf = await window.crypto.subtle.digest('SHA-256', enc);
        return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
      }
    }catch(e){}
    let h = 0;
    for(let i=0;i<payload.length;i++){ h = (h*31 + payload.charCodeAt(i)) >>> 0; }
    return 'fb'+h.toString(16);
  }

  /* ============== UTILS ============== */
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function todayISO(){ return new Date().toISOString().slice(0,10); }
  function round1(n){ return Math.round(n*10)/10; }
  function toDate(iso){ return new Date(iso+"T00:00:00"); }
  function daysBetween(a,b){ return Math.round((toDate(b)-toDate(a))/86400000); }
  function fmtDateShort(iso){ return toDate(iso).toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
  function fmtDateFull(iso){ return toDate(iso).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}); }
  function unitLabel(){ return settings.units === 'kg' ? 'kg' : 'lbs'; }
  function sortedWeights(){ return [...weightEntries].sort((a,b)=> a.date.localeCompare(b.date)); }
  function sortedShots(){ return [...injections].sort((a,b)=> a.date.localeCompare(b.date)); }
  function latestWeight(){ const s = sortedWeights(); return s.length ? s[s.length-1] : null; }
  function escapeHtml(s){ return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  /* ============== COMPUTATION ============== */
  function currentWeightVal(){ const lw = latestWeight(); return lw ? lw.weight : settings.startWeight; }
  function progressPercent(){
    const start = settings.startWeight, goal = settings.goalWeight, cur = currentWeightVal();
    if(start === goal) return 100;
    let pct = ((start - cur) / (start - goal)) * 100;
    if(!isFinite(pct)) pct = 0;
    return Math.max(0, Math.min(100, pct));
  }
  function weeklyRateStat(){
    const s = sortedWeights();
    if(s.length < 2) return null;
    const last = s[s.length-1];
    let ref = null;
    for(let i=s.length-2;i>=0;i--){
      const gap = daysBetween(s[i].date, last.date);
      if(gap >= 3){ ref = s[i]; break; }
    }
    if(!ref) return null;
    const gapDays = daysBetween(ref.date, last.date);
    const delta = ref.weight - last.weight;
    return round1(delta * (7/gapDays));
  }
  function avgWeeklyPace(){
    if(!latestWeight()) return null;
    const daysSinceStart = daysBetween(settings.startDate, todayISO());
    if(daysSinceStart < 7) return null;
    const totalLost = settings.startWeight - currentWeightVal();
    return round1(totalLost / (daysSinceStart/7));
  }
  function nextInjectionDue(){
    const s = sortedShots();
    if(!s.length) return null;
    const last = s[s.length-1];
    const d = toDate(last.date);
    d.setDate(d.getDate() + (settings.intervalDays||7));
    return d.toISOString().slice(0,10);
  }
  function startOfWeek(iso){
    const d = toDate(iso);
    const day = d.getDay();
    const diff = (day===0? -6 : 1-day);
    d.setDate(d.getDate()+diff);
    return d.toISOString().slice(0,10);
  }
  function weeklyBuckets(){
    const s = sortedWeights();
    const map = {};
    s.forEach(e=>{
      const key = startOfWeek(e.date);
      if(!map[key] || e.date > map[key].date) map[key] = e;
    });
    const keys = Object.keys(map).sort();
    return keys.map(k=>({week:k, weight:map[k].weight}));
  }

  /* ============== SHELL / TABS ============== */

      ${warningBanner()}
      <header class="topbar">

          ${ICONS.target}
          <div>
            <h1>Progress Log</h1>

  function tabBtn(id, icon, label){

  function refreshTabbarActive(){

  function renderTab(){
    refreshTabbarActive();

    if(activeTab==='home') $view.innerHTML = renderHome();
    else if(activeTab==='checkin'){ $view.innerHTML = renderCheckinTab(); bindCheckinTab(); }

    else if(activeTab==='trends'){ $view.innerHTML = renderTrendsTab(); bindTrendsTab(); }

  /* ============== HOME ============== */
  function renderHome(){
    const cur = currentWeightVal();
    const goal = settings.goalWeight;
    const toGoal = round1(cur - goal);
    const pct = progressPercent();
    const totalLost = round1(settings.startWeight - cur);
    const weekly = weeklyRateStat();
    const pace = avgWeeklyPace();
    const due = nextInjectionDue();

    let markerNumber, badge='';
    if(toGoal <= 0){
      markerNumber = `${Math.abs(toGoal)} <small>${unitLabel()} past goal</small>`;
      badge = `<span class="marker-badge">Goal reached</span>`;
    } else {
      markerNumber = `${toGoal} <small>${unitLabel()} to go</small>`;
    }

    const s = sortedWeights();
    const spark = s.length >= 2 ? sparklineSVG(s.slice(-12)) : '';

    return `
      <div class="marker-card">
        <p class="marker-eyebrow">To goal</p>
        <div class="marker-number">${markerNumber}</div>
        <p class="marker-sub">${cur} ${unitLabel()} now &middot; goal ${goal} ${unitLabel()}</p>
        ${badge}
        <div class="progress-track">
          <div class="track-line"><div class="track-fill" style="width:${pct}%"></div>
            <div class="dot" style="left:${pct}%"></div>
          </div>
          <div class="track-ends"><span>Start &middot; ${settings.startWeight}</span><span>Goal &middot; ${goal}</span></div>
        </div>
      </div>

      <div class="stat-row">
        <div class="stat-box"><div class="val ${totalLost>=0?'pos':'neg'}">${totalLost>=0?'':'+'}${Math.abs(totalLost)}</div><div class="lbl">${totalLost>=0?'Lost total':'Gained total'}</div></div>
        <div class="stat-box"><div class="val ${weekly==null?'':(weekly>=0?'pos':'neg')}">${weekly==null?'—':(weekly>=0?'':'+')+Math.abs(weekly)}</div><div class="lbl">This week</div></div>
        <div class="stat-box"><div class="val ${pace==null?'':(pace>=0?'pos':'neg')}">${pace==null?'—':(pace>=0?'':'+')+Math.abs(pace)}</div><div class="lbl">Avg / week</div></div>
      </div>

      <div class="card due-card">
        <div class="txt">
          <div class="t1">Next shot</div>
          <div class="t2 ${due && due < todayISO() ? 'overdue':''}">${dueText(due)}</div>
        </div>
        <button class="pill-btn" id="homeLogShot">Log shot</button>
      </div>

      ${s.length>=2 ? `
      <div class="card">
        <p class="section-label">Last ${Math.min(s.length,12)} weigh-ins</p>
        <div class="spark-wrap">${spark}</div>
      </div>` : `
      <div class="card empty-state">
        ${ICONS.list}
        <p>Log a couple of weigh-ins to see your trend line here.</p>
      </div>`}
    `;
  }
  function dueText(due){
    if(!due) return 'Log your first shot';
    const days = daysBetween(todayISO(), due);
    if(days === 0) return `Due today (${fmtDateShort(due)})`;
    if(days < 0) return `Overdue since ${fmtDateShort(due)}`;
    if(days === 1) return `Due tomorrow`;
    return `Due in ${days} days &middot; ${fmtDateShort(due)}`;
  }
  function sparklineSVG(entries){
    const w = 400, h = 56, pad = 4;
    const vals = entries.map(e=>e.weight);
    const min = Math.min(...vals), max = Math.max(...vals);
    const range = (max-min) || 1;
    const stepX = (w - pad*2) / (entries.length-1);
    const pts = entries.map((e,i)=>{
      const x = pad + i*stepX;
      const y = h - pad - ((e.weight-min)/range)*(h-pad*2);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    });
    const last = pts[pts.length-1].split(',');
    return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <polyline points="${pts.join(' ')}" fill="none" stroke="#2E6089" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="${last[0]}" cy="${last[1]}" r="4" fill="#1F3A5C"/>
    </svg>`;
  }
  document.addEventListener('click', (e)=>{
    if(e.target && e.target.id === 'homeLogShot'){ checkinPrefillShot = true; activeTab='checkin'; renderTab(); }
  });

  /* ============== SHARED CONSTS ============== */
  const DOSE_CHIPS = [0.25, 0.5, 1, 1.7, 2, 2.4];
  const SITES = ['Abdomen','Thigh','Upper arm','Other'];

  /* ============== CHECK-IN TAB (weight + optional same-day shot) ============== */
  function renderCheckinTab(){
    const ew = editingWeightId ? weightEntries.find(x=>x.id===editingWeightId) : null;
    const es = editingShotId ? injections.find(x=>x.id===editingShotId) : null;
    const isEditing = !!(ew || es);
    const date = (ew && ew.date) || (es && es.date) || todayISO();
    const shotChecked = !!es || checkinPrefillShot;
    checkinPrefillShot = false;

    return `
      <div class="card">
        <p class="section-label">${isEditing? 'Update check-in':'Log a check-in'}</p>
        <div class="form-grid">
          <div class="form-row">
            <div class="field"><label>Date</label><input type="date" id="cDate" max="${todayISO()}" value="${date}"></div>
            <div class="field"><label>Weight (${unitLabel()})</label><input type="number" step="0.1" min="0" id="cWeight" value="${ew?ew.weight:''}" placeholder="e.g. 210.4"></div>
          </div>
          <div class="field"><label>Note (optional)</label><input type="text" id="cWeightNote" value="${ew&&ew.note?escapeHtml(ew.note):''}" placeholder="How's it going?"></div>

          <div class="toggle-row">
            <input type="checkbox" id="cShotToggle" ${shotChecked?'checked':''}>
            <label for="cShotToggle">Also logging a shot on this date</label>
          </div>

          <div id="shotFields" style="${shotChecked?'':'display:none;'}">
            <div class="form-row">
              <div class="field"><label>Dose (mg)</label><input type="number" step="0.05" min="0" id="cDose" value="${es?es.dose:''}" placeholder="e.g. 1.0"></div>
              <div class="field"><label>Site</label>
                <select id="cSite">
                  ${SITES.map(site=>`<option value="${site}" ${es&&es.site===site?'selected':''}>${site}</option>`).join('')}
                </select>
              </div>
            </div>
            <div class="chip-row" id="doseChips">
              ${DOSE_CHIPS.map(d=>`<span class="chip" data-dose="${d}">${d} mg</span>`).join('')}
            </div>
            <div class="field"><label>Shot note (optional)</label><input type="text" id="cShotNote" value="${es&&es.note?escapeHtml(es.note):''}" placeholder="Side effects, timing, etc."></div>
          </div>

          <p class="err-msg" id="cErr" style="display:none;"></p>
          <div class="form-actions">
            <button class="pill-btn" id="cSaveBtn">${isEditing?'Update check-in':'Save check-in'}</button>
            ${isEditing?'<button class="pill-btn ghost" id="cCancelBtn">Cancel</button>':''}
          </div>
        </div>
      </div>
      <p class="hint-text">Leave weight blank to log a shot-only entry — everything ties together by date.</p>
    `;
  }

  function bindCheckinTab(){
    const toggle = document.getElementById('cShotToggle');
    const shotFields = document.getElementById('shotFields');
    toggle.addEventListener('change', ()=>{ shotFields.style.display = toggle.checked ? '' : 'none'; });

    document.querySelectorAll('#doseChips .chip').forEach(chip=>{
      chip.addEventListener('click', ()=>{
        document.getElementById('cDose').value = chip.dataset.dose;
        document.querySelectorAll('#doseChips .chip').forEach(c=>c.classList.remove('selected'));
        chip.classList.add('selected');
      });
    });

    document.getElementById('cSaveBtn').addEventListener('click', async ()=>{
      const date = document.getElementById('cDate').value;
      const weightRaw = document.getElementById('cWeight').value;
      const weightNote = document.getElementById('cWeightNote').value.trim();
      const shotOn = document.getElementById('cShotToggle').checked;
      const doseRaw = document.getElementById('cDose') ? document.getElementById('cDose').value : '';
      const site = document.getElementById('cSite') ? document.getElementById('cSite').value : SITES[0];
      const shotNote = document.getElementById('cShotNote') ? document.getElementById('cShotNote').value.trim() : '';
      const err = document.getElementById('cErr');
      err.style.display = 'none';

      if(!date){ err.textContent='Pick a date.'; err.style.display='block'; return; }

      const hasWeight = weightRaw !== '';
      let weightVal = null;
      if(hasWeight){
        weightVal = parseFloat(weightRaw);
        if(isNaN(weightVal) || weightVal<=0){ err.textContent='Enter a valid weight, or leave it blank.'; err.style.display='block'; return; }
      } else if(editingWeightId){
        err.textContent='Weight is required when editing a weigh-in. Delete it from History instead.';
        err.style.display='block';
        return;
      } else if(!shotOn){
        err.textContent='Enter a weight or turn on "logging a shot" (or both).';
        err.style.display='block';
        return;
      }

      let doseVal = null;
      if(shotOn){
        doseVal = parseFloat(doseRaw);
        if(isNaN(doseVal) || doseVal<0){ err.textContent='Enter a valid dose for the shot.'; err.style.display='block'; return; }
      }

      if(hasWeight){
        let targetId = editingWeightId;
        if(!targetId){
          const existing = weightEntries.find(x=>x.date===date);
          if(existing) targetId = existing.id;
        }
        if(targetId){
          const idx = weightEntries.findIndex(x=>x.id===targetId);
          weightEntries[idx] = {...weightEntries[idx], date, weight:weightVal, note:weightNote};
        } else {
          weightEntries.push({id:uid(), date, weight:weightVal, note:weightNote});
        }
        await storSet('weight_entries', weightEntries);
      }

      if(shotOn){
        let targetId = editingShotId;
        if(!targetId){
          const existing = injections.find(x=>x.date===date);
          if(existing) targetId = existing.id;
        }
        if(targetId){
          const idx = injections.findIndex(x=>x.id===targetId);
          injections[idx] = {...injections[idx], date, dose:doseVal, site, note:shotNote};
        } else {
          injections.push({id:uid(), date, dose:doseVal, site, note:shotNote});
        }
        await storSet('injections', injections);
      } else if(editingShotId){
        injections = injections.filter(x=>x.id!==editingShotId);
        await storSet('injections', injections);
      }

      editingWeightId = null; editingShotId = null;
      showToast('Check-in saved');
      activeTab = 'home';
      renderTab();
    });

    const cancelBtn = document.getElementById('cCancelBtn');
    if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ editingWeightId=null; editingShotId=null; renderTab(); });
  }

  /* ============== HISTORY TAB ============== */
  function renderHistoryTab(){
    const w = [...sortedWeights()].reverse();
    const s = [...sortedShots()].reverse();
    return `
      <div class="card">
        <p class="section-label">Weigh-ins</p>
        ${w.length===0? emptyBlock('Nothing logged yet. Add one from Check-in.') : w.map((e,i)=>weightRow(e, w[i+1])).join('')}
      </div>
      <div class="card">
        <p class="section-label">Shots</p>
        ${s.length===0? emptyBlock('No injections logged yet. Add one from Check-in.') : s.map(e=>shotRow(e)).join('')}
      </div>
    `;
  }
  function weightRow(e, prev){
    const delta = prev ? round1(prev.weight - e.weight) : null;
    return `
      <div class="entry-row" data-id="${e.id}" data-kind="w">
        <div class="entry-left">
          <span class="entry-date">${fmtDateFull(e.date)}</span>
          <span class="entry-main">${ICONS.scale}${e.weight} ${unitLabel()}</span>
          ${e.note?`<span class="entry-tag">${escapeHtml(e.note)}</span>`:''}
        </div>
        <div class="entry-right">
          ${delta!==null? `<span class="entry-delta ${delta>=0?'pos':'neg'}">${delta>=0?'-':'+'}${Math.abs(delta)}</span>`:''}
          <button class="del-btn" data-del="${e.id}" data-kind="w" aria-label="Delete">×</button>
        </div>
      </div>`;
  }
  function shotRow(e){
    return `
      <div class="entry-row" data-id="${e.id}" data-kind="s">
        <div class="entry-left">
          <span class="entry-date">${fmtDateFull(e.date)}</span>
          <span class="entry-main">${ICONS.syringe}${e.dose} mg</span>
          <span class="entry-tag">${e.site}${e.note?' · '+escapeHtml(e.note):''}</span>
        </div>
        <div class="entry-right">
          <button class="del-btn" data-del="${e.id}" data-kind="s" aria-label="Delete">×</button>
        </div>
      </div>`;

  function emptyBlock(text){ return `<div class="empty-state">${ICONS.list}<p>${text}</p></div>`; }

  function editFromWeight(id){
    editingWeightId = id;
    const w = weightEntries.find(x=>x.id===id);
    const matchingShot = w ? injections.find(x=>x.date===w.date) : null;
    editingShotId = matchingShot ? matchingShot.id : null;
    activeTab = 'checkin';
    renderTab();
  }
  function editFromShot(id){
    editingShotId = id;
    const sh = injections.find(x=>x.id===id);
    const matchingWeight = sh ? weightEntries.find(x=>x.date===sh.date) : null;
    editingWeightId = matchingWeight ? matchingWeight.id : null;
    activeTab = 'checkin';
    renderTab();
  }

  function bindHistoryTab(){
    document.querySelectorAll('[data-kind="w"].entry-row').forEach(row=>{
      row.addEventListener('click', (ev)=>{ if(ev.target.closest('.del-btn')) return; editFromWeight(row.dataset.id); });
    });
    document.querySelectorAll('.del-btn[data-kind="w"]').forEach(btn=>{
      btn.addEventListener('click', async (ev)=>{
        ev.stopPropagation();
        if(!confirm('Delete this weigh-in?')) return;
        const id = btn.dataset.del;
        weightEntries = weightEntries.filter(x=>x.id!==id);
        if(editingWeightId===id) editingWeightId=null;
        await storSet('weight_entries', weightEntries);
        renderTab();
      });
    });
    document.querySelectorAll('[data-kind="s"].entry-row').forEach(row=>{
      row.addEventListener('click', (ev)=>{ if(ev.target.closest('.del-btn')) return; editFromShot(row.dataset.id); });
    });
    document.querySelectorAll('.del-btn[data-kind="s"]').forEach(btn=>{
      btn.addEventListener('click', async (ev)=>{
        ev.stopPropagation();
        if(!confirm('Delete this injection?')) return;
        const id = btn.dataset.del;
        injections = injections.filter(x=>x.id!==id);
        if(editingShotId===id) editingShotId=null;
        await storSet('injections', injections);
        renderTab();
      });
    });
  }

  /* ============== TRENDS TAB ============== */
  function renderTrendsTab(){
    const s = sortedWeights();
    if(s.length < 2){
      return `<div class="card empty-state">${ICONS.list}<p>Log at least two weigh-ins to unlock your charts.</p></div>`;
    }
    return `
      <div class="range-toggle">
        <button data-range="30" class="${trendsRange===30?'active':''}">30d</button>
        <button data-range="90" class="${trendsRange===90?'active':''}">90d</button>
        <button data-range="all" class="${trendsRange==='all'?'active':''}">All</button>
      </div>
      <div class="card">
        <p class="section-label">Weight over time</p>
        <div style="height:220px;"><canvas id="weightChart"></canvas></div>
        <div class="chart-legend">
          <span class="legend-item"><span class="legend-swatch" style="background:#2E6089"></span>Actual</span>
          <span class="legend-item"><span class="legend-swatch" style="background:#C08A2E"></span>7-day trend</span>
          <span class="legend-item"><span class="legend-swatch" style="background:#B24444"></span>Goal</span>
        </div>
      </div>
      <div class="card">
        <p class="section-label">Weekly pace (${unitLabel()} per week)</p>
        <div style="height:150px;"><canvas id="paceChart"></canvas></div>
      </div>
      <div class="card">
        <p class="section-label">Shots in range</p>
        <div id="shotChips" class="chip-scroll"></div>
      </div>
    `;
  }
  function rangeStartDate(){
    if(trendsRange==='all'){
      const all = [...weightEntries.map(e=>e.date), ...injections.map(e=>e.date)];
      return all.length ? all.sort()[0] : todayISO();
    }
    const d = new Date();
    d.setDate(d.getDate() - trendsRange);
    return d.toISOString().slice(0,10);
  }
  function bindTrendsTab(){
    document.querySelectorAll('.range-toggle button').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const r = btn.dataset.range;
        trendsRange = r==='all' ? 'all' : parseInt(r,10);
        renderTab();
      });
    });

    const rStart = rangeStartDate();
    const rEnd = todayISO();
    const allWeights = sortedWeights();
    const trendAll = rollingTrend(allWeights, 7);
    const inRange = allWeights.filter(e=> e.date >= rStart && e.date <= rEnd);
    const labels = inRange.map(e=> fmtDateShort(e.date));
    const actualData = inRange.map(e=> e.weight);
    const trendData = inRange.map(e=>{
      const idx = allWeights.findIndex(x=>x.date===e.date);
      return trendAll[idx];
    });
    const goalData = inRange.map(()=> settings.goalWeight);

    if(chartRef) chartRef.destroy();
    const ctx = document.getElementById('weightChart');
    if(ctx && window.Chart){
      chartRef = new Chart(ctx, {
        type:'line',
        data:{
          labels,
          datasets:[
            {label:'Actual', data:actualData, borderColor:'#2E6089', backgroundColor:'rgba(159,198,224,0.22)', fill:true, tension:0.25, pointRadius:2.5, borderWidth:2.2},
            {label:'7-day trend', data:trendData, borderColor:'#C08A2E', borderDash:[5,4], pointRadius:0, borderWidth:2, tension:0.3},
            {label:'Goal', data:goalData, borderColor:'#B24444', borderDash:[2,3], pointRadius:0, borderWidth:1.6}
          ]
        },
        options:{
          responsive:true, maintainAspectRatio:false,
          plugins:{ legend:{display:false} },
          scales:{
            x:{ ticks:{ maxTicksLimit:6, font:{family:"'IBM Plex Mono', monospace", size:10}, color:'#5B6675' }, grid:{ display:false } },
            y:{ ticks:{ font:{family:"'IBM Plex Mono', monospace", size:10}, color:'#5B6675' }, grid:{ color:'#E4E8EE' } }
          }
        }
      });
    }

    const weeks = weeklyBuckets().filter(w=> w.week >= rStart);
    const paceLabels = weeks.slice(1).map(w=> fmtDateShort(w.week));
    const paceData = weeks.slice(1).map((w,i)=> round1(weeks[i].weight - w.weight));
    if(barChartRef) barChartRef.destroy();
    const ctx2 = document.getElementById('paceChart');
    if(ctx2 && window.Chart){
      barChartRef = new Chart(ctx2, {
        type:'bar',
        data:{ labels:paceLabels, datasets:[{ data:paceData, backgroundColor: paceData.map(v=> v>=0 ? '#9FC6E0' : '#E3B3AF'), borderRadius:4 }]},
        options:{
          responsive:true, maintainAspectRatio:false,
          plugins:{ legend:{display:false} },
          scales:{
            x:{ ticks:{ font:{family:"'IBM Plex Mono', monospace", size:9}, color:'#5B6675' }, grid:{ display:false } },
            y:{ ticks:{ font:{family:"'IBM Plex Mono', monospace", size:9}, color:'#5B6675' }, grid:{ color:'#E4E8EE' } }
          }
        }
      });
    }

    const shotsInRange = sortedShots().filter(e=> e.date >= rStart && e.date <= rEnd).reverse();
    const chipsWrap = document.getElementById('shotChips');
    if(chipsWrap){
      chipsWrap.innerHTML = shotsInRange.length ? shotsInRange.map(e=>`
        <span class="chip-mini"><span class="d1">${fmtDateShort(e.date)}</span><span class="d2">${e.dose} mg · ${e.site}</span></span>
      `).join('') : `<p style="color:var(--ink-soft);font-size:.85rem;">No injections in this range.</p>`;
    }
  }
  function rollingTrend(entriesAsc, windowDays){
    return entriesAsc.map((e)=>{
      const win = entriesAsc.filter(x=> x.date <= e.date && daysBetween(x.date, e.date) < windowDays);
      const avg = win.reduce((s,x)=>s+x.weight,0) / win.length;
      return round1(avg);
    });
  }

            </div>
          </div>

          <hr style="border:none;border-top:1px solid var(--line);margin:18px 0;">
          <p class="section-label">Security</p>
          <div class="form-actions" style="margin-bottom:8px;">
            <button class="pill-btn ghost" id="mChangePw">Change passcode</button>
            <button class="pill-btn ghost" id="mLockNow">Lock now</button>
          </div>
          <div id="pwFields" style="display:none;" class="form-grid">
            <div class="form-row">
              <div class="field"><label>New passcode</label><input type="password" id="mNewPw" autocomplete="off"></div>
              <div class="field"><label>Confirm</label><input type="password" id="mNewPw2" autocomplete="off"></div>
            </div>
            <p class="err-msg" id="mPwErr" style="display:none;"></p>
            <button class="pill-btn" id="mSavePw">Update passcode</button>
          </div>

          <hr style="border:none;border-top:1px solid var(--line);margin:18px 0;">
          <button class="pill-btn danger ghost" id="mReset" style="width:100%;">Reset all data</button>
        </div>
      </div>
    `;
    let pendingUnit = settings.units;
    document.querySelectorAll('[data-unit]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        pendingUnit = btn.dataset.unit;
        document.querySelectorAll('[data-unit]').forEach(b=>b.classList.toggle('active', b===btn));
      });
    });
    document.getElementById('modalOverlay').addEventListener('click', (e)=>{ if(e.target.id==='modalOverlay') closeModal(); });
    document.getElementById('mClose').addEventListener('click', closeModal);

    document.getElementById('mSave').addEventListener('click', async ()=>{
      const startWeight = parseFloat(document.getElementById('mStart').value);
      const startDate = document.getElementById('mStartDate').value;
      const goalWeight = parseFloat(document.getElementById('mGoal').value);
      const intervalDays = parseInt(document.getElementById('mInterval').value,10);
      const err = document.getElementById('mErr');
      if(isNaN(startWeight)||isNaN(goalWeight)||!startDate||isNaN(intervalDays)||intervalDays<1){
        err.textContent = 'Please fill in every field with valid values.';
        err.style.display='block';
        return;
      }
      let factor = 1;
      if(pendingUnit !== settings.units){ factor = pendingUnit==='kg' ? (1/2.20462) : 2.20462; }
      settings = { units: pendingUnit, startWeight: round1(startWeight*factor), startDate, goalWeight: round1(goalWeight*factor), intervalDays };
      if(factor !== 1){
        weightEntries = weightEntries.map(e=> ({...e, weight: round1(e.weight*factor)}));
        await storSet('weight_entries', weightEntries);
      }
      await storSet('settings', settings);
      showToast('Settings saved');
      closeModal();
      renderTab();
    });

    document.getElementById('mChangePw').addEventListener('click', ()=>{
      const el = document.getElementById('pwFields');
      el.style.display = el.style.display==='none' ? '' : 'none';
    });
    document.getElementById('mSavePw').addEventListener('click', async ()=>{
      const p1 = document.getElementById('mNewPw').value;
      const p2 = document.getElementById('mNewPw2').value;
      const err = document.getElementById('mPwErr');
      if(p1.length < 4){ err.textContent='Passcode must be at least 4 characters.'; err.style.display='block'; return; }
      if(p1 !== p2){ err.textContent='Passcodes don\'t match.'; err.style.display='block'; return; }
      err.style.display='none';
      authHash = await hashPassword(p1);
      await storSet('auth_hash', authHash);
      showToast('Passcode updated');
      closeModal();
    });

    document.getElementById('mLockNow').addEventListener('click', ()=>{
      closeModal();
      renderLockScreen();
    });

    document.getElementById('mReset').addEventListener('click', async ()=>{
      if(!confirm('This clears all weight, injection, and settings data on this device — including your passcode. Continue?')) return;
      weightEntries = []; injections = []; settings = null; authHash = null;
      lsRemove('weight_entries'); lsRemove('injections'); lsRemove('settings'); lsRemove('auth_hash');
      closeModal();
      init();
    });
  }
  function closeModal(){ $modalRoot.innerHTML=''; }

  /* ============== LOCK SCREEN ============== */
  function renderLockScreen(){
    $root.innerHTML = `
      ${warningBanner()}
      <div id="lockScreen">
        <div class="lock-icon-wrap">${ICONS.lock}</div>
        <h1>Progress Log</h1>
        <p class="lead">Enter your passcode to continue.</p>
        <input type="password" id="lockInput" autocomplete="off" placeholder="Passcode" autofocus>
        <p class="err-msg" id="lockErr" style="display:none;"></p>
        <button class="pill-btn" id="lockSubmit">Unlock</button>
        <button class="reset-link" id="lockReset">Forgot passcode? Reset app</button>
      </div>
    `;
    const input = document.getElementById('lockInput');
    const submit = async ()=>{
      const val = input.value;
      const h = await hashPassword(val);
      const err = document.getElementById('lockErr');
      if(h === authHash){
        err.style.display='none';
        if(!settings){ renderPasswordSetup(()=>renderShell()); } else { renderShell(); }
      } else {
        err.textContent = 'That passcode is incorrect.';
        err.style.display = 'block';
        input.value = '';
        input.focus();
      }
    };
    document.getElementById('lockSubmit').addEventListener('click', submit);
    input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') submit(); });
    document.getElementById('lockReset').addEventListener('click', async ()=>{
      if(!confirm('This permanently deletes all weigh-ins, injections, settings, and your passcode on this device. This cannot be undone. Continue?')) return;
      weightEntries = []; injections = []; settings = null; authHash = null;
      lsRemove('weight_entries'); lsRemove('injections'); lsRemove('settings'); lsRemove('auth_hash');
      init();
    });
  }

  /* ============== PASSWORD SETUP (first run) ============== */
  function renderPasswordSetup(onDone){
    $root.innerHTML = `
      ${warningBanner()}
      <div id="onboard">
        <h1>Set a passcode</h1>
        <p class="lead">Choose a passcode to keep this app locked when you're not using it. There's no way to recover a forgotten passcode — only a full reset.</p>
        <div class="form-grid">
          <div class="field"><label>Passcode</label><input type="password" id="pNew" autocomplete="off"></div>
          <div class="field"><label>Confirm passcode</label><input type="password" id="pNew2" autocomplete="off"></div>
          <p class="err-msg" id="pErr" style="display:none;"></p>
          <button class="pill-btn" id="pSave" style="margin-top:6px;">Set passcode &amp; continue</button>
        </div>
      </div>
    `;
    document.getElementById('pSave').addEventListener('click', async ()=>{
      const p1 = document.getElementById('pNew').value;
      const p2 = document.getElementById('pNew2').value;
      const err = document.getElementById('pErr');
      if(p1.length < 4){ err.textContent='Passcode must be at least 4 characters.'; err.style.display='block'; return; }
      if(p1 !== p2){ err.textContent='Passcodes don\'t match.'; err.style.display='block'; return; }
      err.style.display='none';
      authHash = await hashPassword(p1);
      await storSet('auth_hash', authHash);
      onDone();
    });
  }

  /* ============== ONBOARDING (first run: goals) ============== */
  function renderOnboarding(){
    $root.innerHTML = `
      ${warningBanner()}
      <div id="onboard">
        <h1>Progress Log</h1>
        <p class="lead">Set your starting weight and the goal you're working toward. You can change any of this later in Settings.</p>
        <div class="form-grid">
          <div class="field"><label>Units</label>
            <div class="unit-toggle">
              <button type="button" data-unit="lbs" class="active">lbs</button>
              <button type="button" data-unit="kg">kg</button>
            </div>
          </div>
          <div class="form-row">
            <div class="field"><label>Starting weight</label><input type="number" step="0.1" id="oStart" placeholder="e.g. 232"></div>
            <div class="field"><label>Starting date</label><input type="date" id="oStartDate" max="${todayISO()}" value="${todayISO()}"></div>
          </div>
          <div class="field"><label>Goal weight</label><input type="number" step="0.1" id="oGoal" placeholder="e.g. 195"></div>
          <div class="field"><label>Injection interval (days)</label><input type="number" step="1" min="1" id="oInterval" value="7"></div>
          <p class="err-msg" id="oErr" style="display:none;"></p>
          <button class="pill-btn" id="oSave" style="margin-top:6px;">Continue</button>
        </div>
      </div>
    `;
    let unit = 'lbs';
    document.querySelectorAll('[data-unit]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        unit = btn.dataset.unit;
        document.querySelectorAll('[data-unit]').forEach(b=>b.classList.toggle('active', b===btn));
      });
    });
    document.getElementById('oSave').addEventListener('click', async ()=>{
      const startWeight = parseFloat(document.getElementById('oStart').value);
      const startDate = document.getElementById('oStartDate').value;
      const goalWeight = parseFloat(document.getElementById('oGoal').value);
      const intervalDays = parseInt(document.getElementById('oInterval').value,10);
      const err = document.getElementById('oErr');
      if(isNaN(startWeight)||startWeight<=0||isNaN(goalWeight)||goalWeight<=0||!startDate||isNaN(intervalDays)||intervalDays<1){
        err.textContent = 'Please fill in every field with valid values.';
        err.style.display='block';
        return;
      }
      err.style.display='none';
      settings = { units: unit, startWeight: round1(startWeight), startDate, goalWeight: round1(goalWeight), intervalDays };
      await storSet('settings', settings);
      renderPasswordSetup(()=>renderShell());
    });
  }

  /* ============== INIT ============== */
  async function init(){
    $root.innerHTML = `<div class="loading-wrap">${ICONS.spinner}<p>Loading your data…</p></div>`;
    storageOK = testStorage();
    const [s, w, i, ah] = await Promise.all([
      storGet('settings'), storGet('weight_entries'), storGet('injections'), storGet('auth_hash')
    ]);
    settings = s;
    weightEntries = w || [];
    injections = i || [];
    authHash = ah;

    if(authHash){
      renderLockScreen();
    } else if(!settings){
      renderOnboarding();
    } else {
      renderPasswordSetup(()=>renderShell());
    }
  }

  init();
})();
</script>
